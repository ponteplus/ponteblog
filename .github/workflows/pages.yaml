# Deploy primário → GitHub Pages (https://blog.ponteplus.com.br/)
# Netlify: alternativa opcional (netlify.toml)
name: Deploy PontePlus Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.161.1
  GO_VERSION: "1.26"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/hugo_modules
            _vendor
          key: hugo-modules-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'hugo.yaml') }}
          restore-keys: |
            hugo-modules-${{ runner.os }}-

      - name: Install Hugo Extended
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.tool_cache }}/hugo_modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo mod tidy
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
